
name: Build NusaFit APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Check Android SDK
        shell: bash
        run: |
          set -e

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "ERROR: Android SDK tidak ditemukan."
            exit 1
          fi

          echo "Android SDK: $SDK"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"

          SDKMANAGER="$(find "$SDK/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null \
            | sort -V | tail -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager tidak ditemukan."
            exit 1
          fi

          echo "Menggunakan: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses \
            || echo "Lisensi mungkin sudah diterima."

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Locate or Generate Gradle Wrapper
        shell: bash
        run: |
          set -e

          if [ ! -f "./gradlew" ]; then
            echo "Membuat Gradle Wrapper menggunakan Gradle 8.13..."
            gradle wrapper --gradle-version 8.13
          fi

          if [ ! -f "./gradlew" ]; then
            echo "ERROR: Gradle Wrapper gagal dibuat."
            exit 1
          fi

          chmod +x ./gradlew

          echo "Gradle Wrapper siap."
          ./gradlew --version

      - name: Build Release APK
        shell: bash
        run: |
          set -e
          ./gradlew --no-daemon clean assembleRelease

      - name: Collect APK
        shell: bash
        run: |
          set -e

          mkdir -p release-apk

          find app/build/outputs/apk \
            -type f -name "*.apk" \
            -exec cp {} release-apk/ \;

          if [ -z "$(ls -A release-apk)" ]; then
            echo "ERROR: APK tidak ditemukan."
            exit 1
          fi

          echo "APK ditemukan:"
          ls -lh release-apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NusaFit-Android-APK
          path: release-apk/*.apk
          if-no-files-found: error
          retention-days: 14
